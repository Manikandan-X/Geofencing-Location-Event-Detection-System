name: geofencing

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: geofence_backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8001:8000"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - .:/app





  mysql:
    image: mysql:8.0

    container_name: geofence_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3308:3306"

    volumes:
      - geofence_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: geofence_redis

    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - geofence_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  geofence_mysql_data:

  geofence_redis_data: